name: TerrakubeAction
description: Run Terrakube 2.34+ jobs with bounded execution and GitHub feedback
branding:
  icon: package
  color: purple
inputs:
  TERRAKUBE_OPERATION:
    description: run a template, plan for external approval, or apply/discard an existing saved run
    default: run
  TERRAKUBE_JOB_ID:
    description: Existing Terrakube job ID; required for apply or discard
  TERRAKUBE_ENDPOINT:
    description: Terrakube API base URL (HTTPS)
    required: true
  TERRAKUBE_ORGANIZATION:
    description: Terrakube organization name
    required: true
  TERRAKUBE_TEMPLATE:
    description: Terrakube template name; must match the existing run for apply or discard
    required: true
  TERRAKUBE_AUTH:
    description: Authentication mode (token or oidc)
    default: token
  TERRAKUBE_TOKEN:
    description: Terrakube PAT; required only with token authentication
  TERRAKUBE_OIDC_AUDIENCE:
    description: Audience registered in the Terrakube federated credential; required for oidc
  TERRAKUBE_BRANCH:
    description: Repository branch (defaults to PR head branch or current ref)
  TERRAKUBE_COMMIT:
    description: Full immutable commit SHA; leave empty only for branch-tip execution
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  TERRAKUBE_ROOT:
    description: Repository-relative root, or newline-separated roots; bypasses change discovery
  TERRAKUBE_WORKSPACE:
    description: Workspace name; requires exactly one explicit root
  TERRAKUBE_WORKSPACE_ID:
    description: Workspace ID instead of a name; requires exactly one explicit root
  CREATE_WORKSPACE:
    description: Allow creating missing workspaces from terrakube.json
    default: 'false'
  TERRAKUBE_SSH_KEY_NAME:
    description: Existing Terrakube SSH key name for workspace creation and SSH repository matching
  TIMEOUT_SECONDS:
    description: Maximum elapsed execution time per job, including polling retries
    default: '3600'
  REQUEST_TIMEOUT_SECONDS:
    description: Maximum time per HTTP request, including credential acquisition and response body
    default: '30'
  POLL_INTERVAL_SECONDS:
    description: Delay between job status reads
    default: '5'
  APPROVAL_MODE:
    description: Wait for manual approval or fail on pause (wait or fail)
    default: wait
  COMMENT_MODE:
    description: PR feedback (off, summary, or full); overrides SHOW_OUTPUT
  SHOW_OUTPUT:
    description: Deprecated; true selects full logs and false selects off when COMMENT_MODE is unset
  GITHUB_TOKEN:
    description: GitHub token for PR comments; omitted feedback is non-fatal
    default: ${{ github.token }}
  TERRAKUBE_UI_URL:
    description: Optional Terrakube UI base URL for job links
  IGNORE_SSL_ERROR:
    description: Disable Terrakube TLS certificate verification; prefer NODE_EXTRA_CA_CERTS
    default: 'false'
outputs:
  HAS_CHANGES:
    description: true for a staged plan ready to apply; false for a no-change plan; otherwise empty
  JOB_ID:
    description: Submitted job ID for a single job; empty for multiple jobs
  JOB_IDS:
    description: JSON array of every submitted job ID, written immediately after submission
  JOB_URL:
    description: UI URL for a single job when TERRAKUBE_UI_URL is set
  STATUS:
    description: Aggregate status (running, planned, completed, failed, skipped)
  JOBS:
    description: JSON array with root, workspace, jobId, jobUrl, status, revision, error and remoteMayBeRunning
runs:
  using: node24
  main: dist/index.js
